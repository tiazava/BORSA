name: Scansione Segnali Borsa Automatici

on:
  schedule:
    # Esegue ogni giorno alle 21:30 italiane (20:30 UTC)
    - cron: '30 20 * * *'
  workflow_dispatch: # Permette anche di avviarlo manualmente con un click

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice dal Repository
        uses: actions/checkout@v3

      - name: Configura Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Installa i pacchetti necessari
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Esegui lo script main.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
