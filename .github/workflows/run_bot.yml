name: Scansione Segnali Borsa

on:
  schedule:
    - cron: "30 18 * * *"
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:

      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installa pacchetti
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests pandas yfinance

      - name: Controlla versione codice
        run: |
          echo "======================================"
          echo "CODICE SCANNER"
          echo "======================================"
          echo "Python:"
          python --version
          echo ""
          echo "File main.py:"
          ls -lh main.py
          echo ""
          echo "Prime righe main.py:"
          head -20 main.py

      - name: Esegui scanner
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py
