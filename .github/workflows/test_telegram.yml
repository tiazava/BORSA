name: TEST TELEGRAM BOT

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:

      - name: Test Secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "=============================="
          echo "CONTROLLO TELEGRAM"
          echo "=============================="

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ERRORE: TELEGRAM_BOT_TOKEN MANCANTE"
            exit 1
          fi

          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "ERRORE: TELEGRAM_CHAT_ID MANCANTE"
            exit 1
          fi

          echo "TOKEN: OK"
          echo "CHAT ID: OK"

      - name: Invia Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          echo "Invio messaggio..."

          curl \
            --max-time 10 \
            --connect-timeout 5 \
            -sS \
            -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            --data "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"🟢 TEST TELEGRAM RIUSCITO! GitHub Actions comunica con Telegram.\"}"

          echo ""
          echo "=============================="
          echo "TEST TERMINATO"
          echo "=============================="
