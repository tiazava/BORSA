name: TROVA CHAT ID TELEGRAM

on:
  workflow_dispatch:

jobs:
  find-chat:
    runs-on: ubuntu-latest

    steps:

      - name: Recupera Chat ID
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |

          echo "======================================"
          echo "RECUPERO CHAT ID"
          echo "======================================"

          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "❌ TELEGRAM_BOT_TOKEN MANCANTE"
            exit 1
          fi

          echo "Controllo aggiornamenti Telegram..."

          RESPONSE=$(curl \
            --silent \
            --show-error \
            --max-time 10 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates")

          echo ""
          echo "RISPOSTA TELEGRAM:"
          echo "$RESPONSE"
          echo ""

          if echo "$RESPONSE" | grep -q '"ok":true'; then
            echo "======================================"
            echo "✅ TELEGRAM RISPONDE CORRETTAMENTE"
            echo "======================================"
          else
            echo "======================================"
            echo "❌ ERRORE TELEGRAM"
            echo "======================================"
            exit 1
          fi
